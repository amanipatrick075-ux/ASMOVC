<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Submit News</title>
<style>
  :root{
    --gap: 12px;
    --max-width: 900px;
  }

  body{
    font-family: system-ui, Arial, sans-serif;
    margin: 16px;
    display: flex;
    justify-content: center;
  }

  .container{
    width: 100%;
    max-width: var(--max-width);
    background: #fff;
    padding: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    border-radius: 8px;
    box-sizing: border-box;
  }

  h1{ margin: 0 0 12px 0; font-size: 1.25rem; }

  form {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: var(--gap);
    align-items: start;
  }

  /* Left column (fields) stacks on small screens */
  .fields {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="email"],
  textarea,
  select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 1rem;
  }

  textarea { min-height: 140px; resize: vertical; }

  .meta {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  button {
    padding: 10px 14px;
    border-radius: 8px;
    border: 0;
    cursor: pointer;
    font-weight: 600;
  }

  button.primary { background: #1f6feb; color: #fff; }
  button.ghost { background: #f6f8fa; color: #111; }

  /* Preview box on the right */
  .preview {
    border: 1px dashed #e3e8ee;
    padding: 12px;
    border-radius: 6px;
    background: #fbfdff;
    min-height: 120px;
  }

  .preview h3 { margin: 0 0 8px 0; font-size: 1rem; }
  .preview p { margin: 0; color: #333; white-space: pre-wrap; }

  /* Responsive: single column under 800px */
  @media (max-width: 800px){
    form { grid-template-columns: 1fr; }
    .actions { justify-content: stretch; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Submit a News Item</h1>

    <form id="newsForm" novalidate>
      <div class="fields">
        <div>
          <label for="title">Title</label>
          <input id="title" name="title" type="text" placeholder="Short headline" required />
        </div>

        <div>
          <label for="summary">Summary</label>
          <textarea id="summary" name="summary" placeholder="Short summary or lede" required></textarea>
        </div>

        <div>
          <label for="content">Full Content</label>
          <textarea id="content" name="content" placeholder="Full article or body"></textarea>
        </div>

        <div style="display:flex;gap:10px;">
          <div style="flex:1;">
            <label for="author">Author</label>
            <input id="author" name="author" type="text" placeholder="Reporter name" />
          </div>
          <div style="width:160px;">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option>Local</option>
              <option>World</option>
              <option>Business</option>
              <option>Tech</option>
              <option>Sports</option>
            </select>
          </div>
        </div>
      </div>

      <aside class="meta">
        <div class="preview" id="preview">
          <h3>Live preview</h3>
          <p id="previewText">Fill in the form to see a preview.</p>
        </div>

        <div class="actions" aria-hidden="false">
          <button type="button" class="ghost" id="clearBtn">Clear</button>
          <button type="submit" class="primary">Publish</button>
        </div>
      </aside>
    </form>
  </div>

<script>
(function(){
  const form = document.getElementById('newsForm');
  const fields = ['title','summary','content','author','category'];
  const previewText = document.getElementById('previewText');
  const clearBtn = document.getElementById('clearBtn');

  function updatePreview(){
    const t = document.getElementById('title').value.trim();
    const s = document.getElementById('summary').value.trim();
    const a = document.getElementById('author').value.trim();
    const c = document.getElementById('category').value;
    let out = t ? t + '\\n\\n' : '';
    out += s ? s + '\\n\\n' : '';
    out += a ? ('By ' + a + ' — ' + c) : ('Category: ' + c);
    previewText.textContent = out || 'Fill in the form to see a preview.';
  }

  // live preview
  fields.forEach(id => {
    document.getElementById(id).addEventListener('input', updatePreview);
  });

  clearBtn.addEventListener('click', () => {
    form.reset();
    updatePreview();
  });

  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    // simple validation
    const title = document.getElementById('title').value.trim();
    const summary = document.getElementById('summary').value.trim();
    if (!title || !summary) {
      alert('Please provide a title and summary.');
      return;
    }

    // simulate submit
    const payload = {
      title,
      summary,
      content: document.getElementById('content').value.trim(),
      author: document.getElementById('author').value.trim(),
      category: document.getElementById('category').value
    };

    // In production, POST to your API endpoint:
    // fetch('/api/news', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
    console.log('submit payload', payload);
    alert('News submitted (demo). Check console.');
    form.reset();
    updatePreview();
  });

  updatePreview();
})();
</script>
</body>
</html>
